name: CI
on:
  push:
    branches: ["**"] # release tags run CI through release.yml
  pull_request:
  workflow_call:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: pnpm install
      - run: pnpm fmt --check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t eink-test -f Dockerfile.test .
      - run: docker run --rm eink-test
